name: Update stock quotes
on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch quotes from Stooq and write quotes.json
        run: |
          python3 - << 'PY'
          import urllib.request, json, datetime
          syms = ["nvda","qqq","tsla","spy","msft","aapl"]
          url = "https://stooq.com/q/l/?s=" + ",".join(s+".us" for s in syms) + "&f=sd2t2ohlcv&h&e=csv"
          out = {}
          try:
              text = urllib.request.urlopen(url, timeout=30).read().decode()
              for line in text.strip().splitlines()[1:]:
                  p = line.split(",")
                  if len(p) >= 7:
                      out[p[0].replace(".US","").lower()] = {"price": float(p[6]), "change": 0, "date": p[1]}
          except Exception as e:
              print("Stooq failed:", e)
          out["_note"] = "Delayed quotes, server-updated file. SpaceX is private, no price."
          data = dict(out)
          data["updated"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          # Only write if we got at least one real price, never overwrite good data with empty
          if any(isinstance(v, dict) and v.get("price") for v in out.values()):
              with open("quotes.json","w") as f:
                  json.dump(data, f, indent=2)
          else:
              print("No prices fetched, keeping existing quotes.json")
          PY
      - name: Commit quotes.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add quotes.json || true
          git diff --cached --quiet || git commit -m "Update stock quotes"
          git push || true
