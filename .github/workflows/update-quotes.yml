name: Update stock quotes
on:
  schedule:
    - cron: "*/15 13-23,0-1 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch quotes from Yahoo Finance and write quotes.json
        run: |
          python3 - << 'PY'
          import urllib.request, json, datetime
          syms = ["NVDA","QQQ","TSLA","SPY","MSFT","AAPL"]
          out = {}
          # Primary: Yahoo v7 quote API - gives postMarketPrice / preMarketPrice reliably
          try:
              url = "https://query1.finance.yahoo.com/v7/finance/quote?symbols=" + ",".join(syms)
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              j = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
              for r in j.get("quoteResponse", {}).get("result", []):
                  sym = r.get("symbol")
                  price = r.get("regularMarketPrice")
                  if sym and price:
                      out[sym.lower()] = {"price": float(price), "change": float(r.get("regularMarketChangePercent", 0) or 0), "date": datetime.datetime.fromtimestamp(r.get("regularMarketTime", 0), datetime.timezone.utc).strftime("%Y-%m-%d"), "after": r.get("postMarketPrice"), "afterChange": r.get("postMarketChangePercent"), "pre": r.get("preMarketPrice"), "preChange": r.get("preMarketChangePercent")}
                      print(sym, "quote ok, after=", r.get("postMarketPrice"), "pre=", r.get("preMarketPrice"))
          except Exception as e:
              print("v7 quote failed:", e)
          # Fallback: chart API for any symbol missing
          for sym in syms:
              if sym.lower() in out:
                  continue
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{sym}?range=5d&interval=1d&includePrePost=true"
              req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              try:
                  j = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
                  res = j["chart"]["result"][0]
                  meta = res["meta"]
                  price = meta.get("regularMarketPrice")
                  prev = meta.get("chartPreviousClose") or meta.get("previousClose")
                  if price:
                      ch = ((price - prev) / prev * 100) if prev else 0
                      out[sym.lower()] = {"price": float(price), "change": float(ch), "date": datetime.datetime.fromtimestamp(meta.get("regularMarketTime", 0), datetime.timezone.utc).strftime("%Y-%m-%d"), "after": meta.get("postMarketPrice"), "afterChange": meta.get("postMarketChangePercent"), "pre": meta.get("preMarketPrice"), "preChange": meta.get("preMarketChangePercent")}
              except Exception as e:
                  print(sym, "chart failed:", e)
          # Extended hours from Nasdaq API: primaryData is current extended price when marketStatus is After-Hours/Pre-Market, secondaryData is regular close
          for sym in syms:
              key = sym.lower()
              if key not in out:
                  continue
              for asset in ["stocks", "etf"]:
                  try:
                      url = f"https://api.nasdaq.com/api/quote/{sym}/info?assetclass={asset}"
                      req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0", "Accept": "application/json", "Accept-Language": "en-US"})
                      j = json.loads(urllib.request.urlopen(req, timeout=30).read().decode())
                      data_q = j.get("data", {})
                      prim = data_q.get("primaryData", {}) or {}
                      sec = data_q.get("secondaryData", {}) or {}
                      status = str(data_q.get("marketStatus", ""))
                      raw = prim.get("lastSalePrice", "")
                      price_ext = float(str(raw).replace("$", "").replace(",", "")) if raw else None
                      pct_raw = prim.get("percentageChange", "")
                      pct_ext = float(str(pct_raw).replace("%", "").replace("+", "")) if pct_raw else None
                      if price_ext and "After" in status:
                          out[key]["after"] = price_ext
                          out[key]["afterChange"] = pct_ext
                          print(sym, "Nasdaq after-hours:", price_ext, pct_ext, status)
                      elif price_ext and "Pre" in status:
                          out[key]["pre"] = price_ext
                          out[key]["preChange"] = pct_ext
                          print(sym, "Nasdaq pre-market:", price_ext, pct_ext, status)
                      else:
                          print(sym, "Nasdaq status:", status, "no extended price used")
                      break
                  except Exception as e:
                      print(sym, "Nasdaq", asset, "failed:", e)
                      continue
          data = dict(out)
          data["updated"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          if out:
              with open("quotes.json","w") as f:
                  json.dump(data, f, indent=2)
              print("Wrote", len(out), "symbols")
          else:
              print("No prices fetched, keeping existing quotes.json")
          PY
      - name: Commit quotes.json
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add quotes.json || true
          git diff --cached --quiet || git commit -m "Update stock quotes"
          git push || true
