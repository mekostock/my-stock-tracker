<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Stock Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1220">
<style>body{font-family:system-ui,sans-serif;background:#0b1220;color:#e8eefc;margin:0;padding:16px}h1{font-size:22px}button{background:#f5c518;border:0;padding:10px 14px;border-radius:8px;font-weight:700}.grid{display:grid;gap:10px}.card{background:#16213a;border:1px solid #26365e;border-radius:12px;padding:12px}.up{color:#4ade80}.down{color:#f87171}.small{color:#94a3b8;font-size:13px}.badge{font-size:12px;padding:2px 6px;border-radius:999px;background:#26365e}</style>
</head><body>
<h1>My Stock Tracker</h1>
<p class="small">Tracking all day while this app is open: auto-refresh every 60 seconds. Quotes are delayed, not tick-by-tick live.</p>
<button id="refresh">Refresh now</button> <span id="time" class="small"></span>
<div id="board" class="grid" style="margin-top:14px"></div>
<p class="small">SpaceX is a private company, not publicly traded, so it has no public stock price.</p>
<script>
const SYMS=[["NVDA","nvda"],["QQQ","qqq"],["Tesla","tsla"],["SPY","spy"],["Microsoft","msft"],["Apple","aapl"]];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function fetchText(u){const r=await fetch(u); if(!r.ok) throw new Error('HTTP '+r.status); return r.text()}
async function stooq(){
  const syms=SYMS.map(x=>x[1]).join(',');
  const urls=['https://stooq.com/q/l/?s='+SYMS.map(x=>x[1]+'.us').join(',')+'&f=sd2t2ohlcv&h&e=csv','https://api.allorigins.win/raw?url='+encodeURIComponent('https://stooq.com/q/l/?s='+SYMS.map(x=>x[1]+'.us').join(',')+'&f=sd2t2ohlcv&h&e=csv')];
  for(const u of urls){ try{ const t=await fetchText(u); const lines=t.trim().split('\n').slice(1); const out={};
    for(const ln of lines){ const p=ln.split(','); const s=p[0].replace('.US','').toLowerCase(); out[s]={price:parseFloat(p[6]),change:isFinite(parseFloat(p[8]))?parseFloat(p[8]):0,date:p[1]}; }
    if(Object.keys(out).length) return out; }catch(e){} }
  throw new Error('Stooq failed');
}
async function yahooQuotes(){
  const out={};
  for(const [name,sym] of SYMS){
    const urls=['https://api.allorigins.win/raw?url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/'+sym.toUpperCase()+'?range=5d&interval=1d'),
      'https://query1.finance.yahoo.com/v8/finance/chart/'+sym.toUpperCase()+'?range=5d&interval=1d'];
    for(const u of urls){ try{ const r=await fetch(u); if(!r.ok) continue; const j=await r.json(); const res=j.chart&&j.chart.result&&j.chart.result[0]; const meta=res&&res.meta; if(!meta||!isFinite(meta.regularMarketPrice)) continue;
      const prev=meta.chartPreviousClose||meta.previousClose; const ch=prev?((meta.regularMarketPrice-prev)/prev*100):0;
      out[sym]={price:meta.regularMarketPrice,change:ch,date:new Date(meta.regularMarketTime*1000).toLocaleDateString()}; break; }catch(e){} }
  }
  return out;
}
async function quotesJson(){
  const r=await fetch('./quotes.json?x='+Date.now()); if(!r.ok) throw new Error('no quotes.json');
  const j=await r.json(); const out={};
  for(const [name,sym] of SYMS){ const v=j[sym]||j[sym.toUpperCase()]; if(v&&isFinite(v.price)) out[sym]={price:v.price,change:v.change||0,date:v.date||''}; }
  return {quotes:out,updated:j.updated||''};
}
async function load(){
  document.getElementById('board').innerHTML='<p class="small">Loading delayed quotes…</p>';
  try{ let q={}; let src='Stooq';
    try{ const jq=await quotesJson(); if(Object.keys(jq.quotes).length){ q=jq.quotes; src='Server-updated file'+(jq.updated?' · Updated '+jq.updated:''); } }catch(e){}
    if(!Object.keys(q).length){ try{ q=await stooq(); }catch(e){ q={}; } }
    if(!Object.keys(q).length || !SYMS.some(([n,s])=>q[s]&&isFinite(q[s].price))){ q=await yahooQuotes(); src='Yahoo Finance'; }
    if(!Object.keys(q).length) throw new Error('All feeds failed');
    document.getElementById('time').textContent='Last updated: '+new Date().toLocaleTimeString()+' · Source: '+src+' · Delayed';
    document.getElementById('board').innerHTML=SYMS.map(([name,sym])=>{const v=q[sym]; if(!v||!isFinite(v.price)) return '<div class="card"><b>'+esc(name)+'</b> <span class="badge">Unavailable</span></div>';
      const cls=v.change>=0?'up':'down'; return '<div class="card"><b>'+esc(name)+' ('+sym.toUpperCase()+')</b><br><b>$'+v.price.toFixed(2)+'</b> <span class="'+cls+'">'+(v.change>=0?'+':'')+v.change.toFixed(2)+'%</span><br><span class="badge">Delayed</span> <span class="small">'+esc(v.date||'')+'</span></div>'}).join('')+'<div class="card"><b>SpaceX</b><br><span class="badge">Private company</span><br><span class="small">Not publicly traded, no public stock price.</span></div>';
  }catch(e){ document.getElementById('board').innerHTML='<p class="small">Market data unavailable right now. Try Refresh again later. No prices are shown rather than stale or wrong numbers.</p><div class="card"><b>SpaceX</b><br><span class="badge">Private company</span><br><span class="small">Not publicly traded, no public stock price.</span></div>'; }
}
document.getElementById('refresh').onclick=load; load();
setInterval(()=>{ if(!document.hidden) load(); },60000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) load(); });
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script></body></html>
